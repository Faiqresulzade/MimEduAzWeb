services:
  - type: web
    name: mimeduazweb
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_ORIGIN
        value: https://mimeduazback.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
